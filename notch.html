<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Jarvis Notch</title>
<style>
:root {
  --blue-rgb: 127, 180, 216;
  --violet-rgb: 168, 156, 240;
  --green-rgb: 126, 214, 168;
  --amber-rgb: 240, 198, 116;

  --silver: #eef6fd;
  --steel: #b6cddf;
  --dim: #7b99b0;
  --faint: #55708a;

  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.16, 1.02, .3, 1);
}
* { box-sizing: border-box }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: transparent;
  font-family: var(--mono);
  color: var(--silver);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; align-items: center; padding-top: 3px }

/* -------------------------------------------------------- pill (capsule) -- */
#pill {
  position: absolute; top: 3px; left: 50%;
  transform: translateX(-50%);
  height: 30px; padding: 0 18px;
  display: flex; align-items: center; gap: 10px;
  border-radius: 15px;
  background: rgba(0, 0, 0, .5);
  backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 12px 30px -14px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(255, 255, 255, .10);
  font-size: 11px; letter-spacing: .12em; color: var(--steel);
  z-index: 3;
  transition: top .36s var(--spring), opacity .22s ease, transform .32s var(--spring);
}
body.open #pill { opacity: 0; transform: translate(-50%, -8px) scale(.94) }
body.hide #pill { opacity: 0; transform: translate(-50%, -14px) }
body.hide #panel { opacity: 0; transform: translate(-50%, -14px) scale(.96) }
#pill .sep { color: var(--faint) }
#pill .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgb(var(--blue-rgb));
  box-shadow: 0 0 10px rgba(var(--blue-rgb), 1);
  animation: breathe 3.4s ease-in-out infinite;
}
#pill .batt { color: rgb(var(--green-rgb)); letter-spacing: .06em }
@keyframes breathe { 50% { opacity: .3 } }

/* ------------------------------------------------------------ panel ----- */
#panel {
  position: absolute; top: 3px; left: 50%;
  transition: top .36s var(--spring), opacity .2s ease, transform .38s var(--spring);
  width: 536px;
  border-radius: 24px;
  background: rgba(0, 0, 0, .5);
  backdrop-filter: blur(30px) saturate(165%);
  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .95), inset 0 0 0 1px rgba(255, 255, 255, .12);
  padding: 14px 14px 10px;
  transform: translate(-50%, -14px) scale(.94);
  transform-origin: top center;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .38s var(--spring);
  z-index: 2;
  overflow: hidden;
}
body.open #panel { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1) }

/* top gloss */
#panel::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent);
}

/* --------------------------------------------------------- carousel ----- */
#viewport { overflow: hidden; border-radius: 18px }
#pages {
  display: flex;
  transition: transform .5s var(--spring);
  will-change: transform;
}
.page {
  flex: 0 0 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 2px;
}

/* ----------------------------------------------------------- widgets ---- */
.w {
  --wa: var(--blue-rgb);
  position: relative;
  display: flex; flex-direction: column;
  min-height: 148px;
  border-radius: 18px;
  padding: 11px 13px 13px;
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(var(--wa), .20), transparent 62%),
    linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015));
  border: 1px solid rgba(var(--wa), .20);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  overflow: hidden;
  opacity: 0; transform: translateY(10px) scale(.985);
  transition: border-color .25s, box-shadow .3s, transform .3s var(--ease);
}
.w.blue { --wa: var(--blue-rgb) }
.w.violet { --wa: var(--violet-rgb) }
.w.green { --wa: var(--green-rgb) }
.w.amber { --wa: var(--amber-rgb) }

.page.active .w { animation: cardIn .46s var(--spring) both }
.page.active .w:nth-child(1) { animation-delay: .02s }
.page.active .w:nth-child(2) { animation-delay: .09s }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(.97) }
  to { opacity: 1; transform: none }
}
.w:hover { border-color: rgba(var(--wa), .5); box-shadow: 0 0 34px -18px rgba(var(--wa), 1), inset 0 1px 0 rgba(255, 255, 255, .1) }

.wh {
  display: flex; align-items: center; gap: 7px;
  font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(var(--wa), .95); margin-bottom: 9px;
}
.wh svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none }
.wh .spacer { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--wa), .35), transparent) }

.big { font-size: 34px; line-height: 1; color: var(--silver); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.big em { font-style: normal; font-size: .38em; color: var(--dim); margin-left: 3px; letter-spacing: 0 }
.sm { font-size: 10px; color: var(--steel); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sm.dim, .dim { color: var(--faint) }
.grow { flex: 1 }

/* clock */
#clock { display: flex; align-items: baseline; gap: 2px }
#clock .colon { animation: blink 2.4s steps(1) infinite; color: rgba(var(--blue-rgb), .9) }
@keyframes blink { 50% { opacity: .25 } }

/* calendar list */
#events { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
#events li {
  display: flex; gap: 8px; align-items: center;
  padding: 5px 8px; border-radius: 10px;
  background: rgba(255, 255, 255, .045);
  font-size: 10px; color: var(--steel);
  animation: rowIn .4s var(--spring) both;
}
#events li:nth-child(2) { animation-delay: .06s }
#events li:nth-child(3) { animation-delay: .12s }
@keyframes rowIn { from { opacity: 0; transform: translateX(-6px) } }
#events li b { color: rgb(var(--wa)); font-weight: 600; font-size: 9px; letter-spacing: .04em; flex: none }
#events li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* bars */
.rows { display: flex; flex-direction: column; gap: 7px }
.rowm .rh { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); letter-spacing: .1em; margin-bottom: 3px }
.rowm .rh b { color: var(--steel); font-weight: 500 }
.bar { height: 4px; border-radius: 999px; background: rgba(170, 200, 225, .13); overflow: hidden }
.bar i {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, rgba(var(--wa), .45), rgba(var(--wa), 1));
  box-shadow: 0 0 12px rgba(var(--wa), .65);
  transition: width .6s var(--ease), background .3s;
}
.bar.warm i { background: linear-gradient(90deg, rgba(var(--amber-rgb), .5), rgb(var(--amber-rgb))) }
.bar.hot i { background: linear-gradient(90deg, rgba(224, 120, 130, .55), rgb(224, 120, 130)) }
.kv { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); letter-spacing: .06em; margin-top: 6px }
.kv b { color: var(--steel); font-weight: 500 }

/* world clocks */
.tzs { display: flex; flex-direction: column; gap: 1px; margin-top: 5px; max-height: 62px; overflow-y: auto }
.tzs .tz {
  display: flex; align-items: center; gap: 6px;
  font-size: 9.5px; color: var(--steel);
  padding: 2px 5px; border-radius: 7px; cursor: pointer;
  animation: rowIn .35s var(--spring) both;
  transition: background .16s, color .16s;
}
.tzs .tz:hover { background: rgba(224, 120, 130, .16); color: #ffd9dd }
.tzs .tz i { flex: none; width: 4px; height: 4px; border-radius: 50%; background: rgba(var(--blue-rgb), .8) }
.tzs .tz span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tzs .tz b { font-weight: 500; color: var(--silver); font-variant-numeric: tabular-nums }
.tzs .tz em { font-style: normal; font-size: 8px; color: rgba(var(--violet-rgb), .95); margin-left: 3px }

/* In-flow chip list. It used to be an absolute popup that covered the
   "+ zone" button, so real clicks landed on a preset instead of the toggle. */
.tzmenu {
  position: static;
  display: flex; flex-wrap: wrap; gap: 4px;
  max-height: 76px; overflow-y: auto;
  margin-top: 5px; padding: 4px; border-radius: 10px;
  background: rgba(0, 0, 0, .32);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
  animation: cardIn .22s var(--spring) both;
}
.tzmenu[hidden] { display: none }
.tzmenu button {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em;
  color: var(--steel); background: rgba(var(--blue-rgb), .13);
  border: 0; border-radius: 999px;
  padding: 3px 8px; cursor: pointer; transition: .15s;
  white-space: nowrap;
}
.tzmenu button:hover { background: rgba(var(--blue-rgb), .32); color: #fff }
.tzmenu button:disabled { opacity: .45; cursor: default }

/* clipboard list */
#clips { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px }
#clips li {
  font-size: 9.5px; line-height: 1.35; color: var(--steel);
  padding: 5px 8px; border-radius: 10px;
  background: rgba(255, 255, 255, .045);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer; transition: background .18s, color .18s, transform .18s;
  animation: rowIn .4s var(--spring) both;
}
#clips li:hover { background: rgba(var(--amber-rgb), .2); color: #fff; transform: translateX(2px) }
#clips li.copied { background: rgba(var(--green-rgb), .26); color: #eafff5 }

.eq { display: block; width: 100%; height: 46px; margin: 4px 0 8px }

/* buttons */
.mini {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--steel); background: rgba(var(--wa), .14);
  border: 1px solid rgba(var(--wa), .28); border-radius: 10px;
  padding: 6px 10px; cursor: pointer; transition: .18s var(--ease); white-space: nowrap;
}
.mini:hover { background: rgba(var(--wa), .28); color: #fff; border-color: rgba(var(--wa), .55); transform: translateY(-1px) }
.mini:active { transform: scale(.96) }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.grid2 .mini { text-align: center; padding: 8px 6px }

/* -------------------------------------------------------------- dots ----- */
#dots {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 0 1px;
}
#dots i {
  width: 5px; height: 5px; border-radius: 999px;
  background: rgba(255, 255, 255, .22);
  transition: width .3s var(--spring), background .3s;
  cursor: pointer;
}
#dots i.on { width: 16px; background: rgba(var(--blue-rgb), .95) }

/* ------------------------------------------------------------- toast ----- */
#toast {
  position: absolute; top: 3px; left: 50%;
  display: flex; align-items: center; gap: 9px;
  height: 34px; padding: 0 16px 0 12px;
  border-radius: 17px;
  background: rgba(0, 0, 0, .5);
  backdrop-filter: blur(22px) saturate(155%);
  box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .95), inset 0 0 0 1px rgba(var(--ta, 127, 180, 216), .40);
  color: #f2f8fd; font-size: 10.5px; letter-spacing: .04em;
  white-space: nowrap; max-width: 520px;
  transform: translate(-50%, -46px) scale(.94);
  opacity: 0; pointer-events: none;
  transition: transform .38s var(--spring), opacity .24s ease;
  z-index: 4;
}
#toast.show { transform: translate(-50%, 0) scale(1); opacity: 1 }
/* a toast pushes the notch down instead of covering it */
body.notif #pill { top: 45px }
body.notif #panel { top: 45px }
#toast .t-ico {
  width: 18px; height: 18px; flex: none; display: grid; place-items: center;
  border-radius: 7px; background: rgba(var(--ta, 127, 180, 216), .2);
  color: rgb(var(--ta, 127, 180, 216));
}
#toast .t-ico svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
#toast b { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 9px; color: rgb(var(--ta, 127, 180, 216)) }
#toast .t-detail { color: #d7e6f2; max-width: 300px; overflow: hidden; text-overflow: ellipsis }
#toast[data-kind="copy"] { --ta: 240, 198, 116 }
#toast[data-kind="shot"] { --ta: 126, 214, 168 }
#toast[data-kind="music"] { --ta: 168, 156, 240 }
#toast[data-kind="info"] { --ta: 127, 180, 216 }
</style>
</head>
<body>
<div id="toast" data-kind="info">
  <span class="t-ico" id="t-ico"></span>
  <b id="t-title">event</b>
  <span class="t-detail" id="t-detail"></span>
</div>

<div id="pill" class="hit">
  <span id="pill-time">--:--</span>
  <span class="sep">·</span>
  <span id="pill-temp">--°</span>
  <span class="batt" id="pill-batt"></span>
  <span class="dot"></span>
</div>

<div id="panel" class="hit">
  <div id="viewport">
    <div id="pages">

      <!-- page 1: clock + calendar -->
      <section class="page active">
        <div class="w blue clock">
          <div class="wh"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>Time</span><span class="spacer"></span></div>
          <div class="big" id="clock"><span id="clock-hm">--:--</span></div>
          <div class="sm" id="date">—</div>
          <div class="grow"></div>
          <div class="sm dim" id="uptime">up —</div>
          <div class="tzs" id="tzs"></div>
          <button class="mini" id="tz-add" style="align-self:flex-start;margin-top:6px">+ zone</button>
          <div class="tzmenu" id="tzmenu" hidden></div>
        </div>

        <div class="w blue cal">
          <div class="wh"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Calendar</span><span class="spacer"></span></div>
          <ul id="events"><li class="dim">no events</li></ul>
        </div>
      </section>

      <!-- page 2: weather + system -->
      <section class="page">
        <div class="w blue weather">
          <div class="wh"><svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1 .3-8 5.5 5.5 0 0 1 10.4 1.6A3.6 3.6 0 0 1 17.4 17z"/></svg><span>Weather</span><span class="spacer"></span></div>
          <div class="big"><span id="w-temp">--</span><em>°C</em></div>
          <div class="sm" id="w-city">no city yet</div>
          <div class="grow"></div>
          <div class="sm dim" id="w-feels">&nbsp;</div>
          <div class="sm dim" id="w-days">&nbsp;</div>
        </div>

        <div class="w green system">
          <div class="wh"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg><span>System</span><span class="spacer"></span></div>
          <div class="rows" id="hw-rows"></div>
          <div class="grow"></div>
          <div class="kv"><span>BATTERY</span><b id="batt">—</b></div>
        </div>
      </section>

      <!-- page 3: network + music -->
      <section class="page">
        <div class="w violet net">
          <div class="wh"><svg viewBox="0 0 24 24"><path d="M3 12a15 15 0 0 1 18 0M6.5 15.5a10 10 0 0 1 11 0M10 19a5 5 0 0 1 4 0"/><circle cx="12" cy="21" r=".6"/></svg><span>Network</span><span class="spacer"></span></div>
          <div class="big" id="net-rate">—</div>
          <div class="sm" id="net-label">no adapters</div>
          <div class="grow"></div>
          <div class="kv"><span>DOWNLOAD</span><b id="net-rx">—</b></div>
          <div class="kv"><span>UPLOAD</span><b id="net-tx">—</b></div>
        </div>

        <div class="w violet music">
          <div class="wh"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="2.6"/><circle cx="16" cy="16" r="2.6"/></svg><span>Music</span><span class="spacer"></span></div>
          <canvas class="eq" id="eq"></canvas>
          <div class="sm" id="track">nothing playing</div>
          <div class="grow"></div>
          <button class="mini" id="m-pick" style="align-self:flex-start">Load track</button>
        </div>
      </section>

      <!-- page 4: clipboard + actions -->
      <section class="page">
        <div class="w amber clip">
          <div class="wh"><svg viewBox="0 0 24 24"><rect x="8" y="4" width="12" height="16" rx="3"/><path d="M16 4h-2a2 2 0 0 0-2 2v12"/><path d="M6 8H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h7"/></svg><span>Clipboard</span><span class="spacer"></span></div>
          <ul id="clips"><li class="dim" style="cursor:default">empty</li></ul>
          <div class="grow"></div>
          <button class="mini" id="clip-clear" style="align-self:flex-start">Clear history</button>
        </div>

        <div class="w green actions">
          <div class="wh"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Actions</span><span class="spacer"></span></div>
          <div class="grid2">
            <button class="mini" id="open-jarvis">Jarvis</button>
            <button class="mini" id="new-chat">New chat</button>
            <button class="mini" id="quick-monitor">Watch on</button>
            <button class="mini" id="quick-refresh">Refresh</button>
          </div>
          <div class="grow"></div>
          <div class="sm dim" id="act-note">wheel to switch panels</div>
        </div>
      </section>

    </div>
  </div>
  <div id="dots"></div>
</div>

<script type="module" src="./notch.mjs"></script>
</body>
</html>
